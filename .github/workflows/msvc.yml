# https://github.com/microsoft/msvc-code-analysis-action

name: Microsoft C++ Code Analysis

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "32 21 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # Path to the CMake build directory.
  build: "${{ github.workspace }}/build"
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # required for private repo by github/codeql-action/upload-sarif to get Action run status
    name: Analyze
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Python requirements
        run: |
          pip install -r requirements/package.txt
          pip install -r requirements/dev.txt

      - name: Configure CMake
        env:
          BUILD_DIR: ${{ env.build }}
        run: cmake -B "$env:BUILD_DIR"

      # Build is not required unless generated source files are used
      - name: Build CMake
        env:
          BUILD_DIR: ${{ env.build }}
        run: cmake --build "$env:BUILD_DIR" --config "$env:BUILD_TYPE"

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
        # Provide a unique ID to access the sarif output path
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset
          ignoredIncludePaths: external
          ignoreSystemHeaders: true
          buildConfiguration: ${{env.BUILD_TYPE}}

      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}
